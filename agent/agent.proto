syntax = "proto3";

package agent;

option go_package = "./agent";

/********* Kubernetes *********/
message PatchWorkloadRequest {
  string namespace = 1;
  string workload_type = 2;
  string workload_name = 3;
  string container = 4;
  string image = 5;
}
message ListResourceRequest {
  string namespace = 1;
  string resource_type = 2;
  string label_selector = 3;
  string field_selector = 4;
  string continue = 5;
  int64  limit = 6;
}
message GetResourceRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
}
message GetEventRequest {
  string namespace = 1;
  string object_kind = 2;
  string object_name = 3;
}
message YamlRequest {
  string namespace = 1;
  string ymlstring = 2;
  string kind = 3;
}
message GetYamlRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
}
message ScaleRequest {
  string namespace = 1;
  string workload_type = 2;
  string workload_name = 3;
  uint32 replicas = 4;
}
message ReplicaRequest {
  string namespace = 1;
  string workload_type = 2;
  repeated string workloads = 3;
  bool init_container = 4;
}
message LabelSelector {
  string label_selector = 1;
}
message PodLogRequest {
  string namespace = 1;
  string podname = 2;
  string container_name = 3;
  uint64 lines = 4;
  bool   timestamps = 5;
}
message PodCommandRequest {
  string namespace = 1;
  string podname = 2;
  string container_name = 3;
  string command = 4;
}
message HpaRequest {
  string namespace = 1;
  string workload_name = 2;
  int32 max = 3;
  int32 min = 4;
  int32 cpu = 5;
  int32 memory = 6;
}
message DeleteResourceRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
  bool   force = 4;
}
message PatchConfigmapRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
  string key = 4;
  string value = 5;
}
message Response {
  uint32 code = 1;
  string message = 2;
  bytes  data = 3;
}
message YamlResponse {
  uint32 code = 1;
  string data = 2;
}

/********* Istio *********/
message IstioCreateRequest {
  string namespace = 1;
  bytes  resource_body = 2;
} 
message IstioPatchRequest {
  string namespace = 1;
  string name = 2;
  bytes  resource_body = 3;
}
message IstioGetRequest {
  string namespace = 1;
  string name = 2;
}

/********* Tekton *********/
message TektonListRequest {
  string namespace = 1;
  string resource_type = 2;
  string label_selector = 3;
  string field_selector = 4;
  string continue = 5;
  int64  limit = 6;
}
message TektonYamlRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
  string ymlstring = 4; 
  string with_status = 5;
}
message TektonPatchRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
  bytes  patch_options = 4;
}
message TektonEndpointRequest {}

/********* Helm *********/
message HelmEntriesRequest {
  bytes entries = 1;
}
message HelmInstallChartRequest {
  string namespace = 1;
  string repo_url = 2;
  string chart_name = 3;
  string chart_version = 4;
  string release_name = 5;
  bytes  values = 6;
  int32  revision = 7;
  bool   wait = 8;
  int64  timeout = 9;
}
message ListReleasesRequest {
  string namespace = 1;
  string release_name = 2;
  int32  revision = 3;
}

/********* VmDeploy *********/
message VmDeployRequest {
  string artifact_url = 1;
  bytes  artifact_header = 2;
  string deploy_path = 3;
  string deploy_user = 4;
  string command_type = 5;
  string pre_command = 6;
  string start_command = 7;
}
message VmHealthCheckRequest {
  string type = 1;
  string uri = 2;
  string port = 3;
  string method = 4;
  string shell = 5;
}
message RunCommandRequest {
  string run_user = 1;
  string command = 2;
  bytes byte_command = 3;
  string command_type = 4;
  bool reserve_tmp = 5;
}
message FileRequest {
  string filename = 1;
}
message dockerDeployRequest {
  string container_name = 1;
  string image = 2;
  string network = 3;
  string ports = 4;
  string volumes = 5;
  string dns = 6;
  string working_dir = 7;
  repeated string command = 8;
}

service LizardAgent {
  // kubernetes
  rpc getNamespaces(LabelSelector) returns(Response);
  rpc listResource(ListResourceRequest) returns(Response);
  rpc getResource(GetResourceRequest) returns(Response);
  rpc deleteResource(DeleteResourceRequest) returns(Response);
  rpc patchWorkload(PatchWorkloadRequest) returns(Response);
  rpc rolloutWorkload(PatchWorkloadRequest) returns(Response);
  rpc scaleWorkload(ScaleRequest) returns(Response);
  rpc getEvent(GetEventRequest) returns(Response);
  rpc getResourceStatus(GetResourceRequest) returns(Response);
  rpc deleteYaml(YamlRequest) returns(Response);
  rpc applyYaml(YamlRequest) returns(Response);
  rpc getYaml(GetYamlRequest) returns(YamlResponse);
  rpc getWorkloadPod(GetResourceRequest) returns(Response);
  rpc getWorkloadReplicas(ReplicaRequest) returns(Response);
  rpc getWorkloadImages(ReplicaRequest) returns(Response);
  rpc getWorkloadQuota(GetResourceRequest) returns(Response);
  rpc getPodLog(PodLogRequest) returns(YamlResponse);
  rpc getPodLogFollow(PodLogRequest) returns(stream YamlResponse);
  rpc setPodHorizonAutoscaler(HpaRequest) returns(Response);
  rpc getPodHorizonAutoscaler(PatchWorkloadRequest) returns(Response);
  rpc runCommandInPod(stream PodCommandRequest) returns(stream Response);
  rpc patchConfigmap(PatchConfigmapRequest) returns(Response);
  // istio
  rpc createDestinationRule(IstioCreateRequest) returns(Response);
  rpc patchDestinationRule(IstioPatchRequest) returns(Response);
  rpc listDestinationRule(ListResourceRequest) returns(Response);
  rpc getDestinationRule(IstioGetRequest) returns(Response);
  rpc deleteDestinationRule(IstioGetRequest) returns(Response);
  rpc createVirtualService(IstioCreateRequest) returns(Response);
  rpc patchVirtualService(IstioPatchRequest) returns(Response);
  rpc listVirtualService(ListResourceRequest) returns(Response);
  rpc getVirtualService(IstioGetRequest) returns(Response);
  rpc deleteVirtualService(IstioGetRequest) returns(Response);
  rpc patchGateway(IstioPatchRequest) returns(Response);
  rpc listGateway(ListResourceRequest) returns(Response);
  rpc getGateway(IstioGetRequest) returns(Response);
  rpc deleteGateway(IstioGetRequest) returns(Response);
  // tekton
  rpc listTektonResource(TektonListRequest) returns(Response);
  rpc getTektonResource(TektonYamlRequest) returns(Response);
  rpc patchTektonResource(TektonPatchRequest) returns(Response);
  rpc getTektonYaml(TektonYamlRequest) returns(YamlResponse);
  rpc applyTektonResource(TektonYamlRequest) returns(Response);
  rpc deleteTektonResource(TektonYamlRequest) returns(Response);
  rpc getTektonEndpoint(TektonEndpointRequest) returns(Response);
  // helm
  rpc helmUpdateRepo(HelmEntriesRequest) returns(Response);
  rpc helmInstallChart(HelmInstallChartRequest) returns(Response);
  rpc helmUninstallChart(HelmInstallChartRequest) returns(Response);
  rpc helmUpgradeChart(HelmInstallChartRequest) returns(Response);
  rpc helmListReleases(ListReleasesRequest) returns(Response);
  rpc helmGetValues(ListReleasesRequest) returns(Response);
  rpc helmReleaseHistory(ListReleasesRequest) returns(Response);
  rpc helmRollback(HelmInstallChartRequest) returns(Response);
  // vm deploy
  rpc vmDeploy(VmDeployRequest) returns(Response);
  rpc vmHealthCheck(VmHealthCheckRequest) returns(Response);
  rpc runCommand(RunCommandRequest) returns(stream YamlResponse);
  rpc downloadFile(FileRequest) returns(stream Response);
  // docker deploy
  rpc dockerDeploy(dockerDeployRequest) returns(Response);
  rpc dockerCheck(dockerDeployRequest) returns(Response);
}