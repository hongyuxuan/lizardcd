---
name: tekton_template_task_go1.23.0_build
content: |
  apiVersion: tekton.dev/v1
  kind: Task
  metadata:
    annotations:
      author: {{ .Username }}
      tekton.dev/categories: Build Tools
      tekton.dev/displayName: golang build
      tekton.dev/pipelines.minVersion: 0.12.1
      tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le
      tekton.dev/tags: build-tool
    labels:
      app.kubernetes.io/version: "0.3"
    name: {{ .Appname }}-build-task
    namespace: default
  spec:
    description: This Task is Golang task to build Go projects.
    params:
    - default: ''
      description: 'application name'
      name: appname
      type: string
    - default: latest
      description: golang version to use for builds
      name: version
      type: string
    - default: -v
      description: flags to use for the test command
      name: flags
      type: string
    - default: linux
      description: running program's operating system target
      name: GOOS
      type: string
    - default: amd64
      description: running program's architecture target
      name: GOARCH
      type: string
    - default: auto
      description: value of module support
      name: GO111MODULE
      type: string
    - default: ""
      description: Go caching directory path
      name: GOCACHE
      type: string
    - default: ""
      description: Go mod caching directory path
      name: GOMODCACHE
      type: string
    - default: "0"
      description: Toggle cgo tool during Go build. Use value '0' to disable cgo (for
        static builds).
      name: CGO_ENABLED
      type: string
    - default: ""
      description: Go checksum database url. Use value 'off' to disable checksum validation.
      name: GOSUMDB
      type: string
    - default: https://goproxy.cn,direct
      name: GOPROXY
      type: string
    results:
    - name: version
      type: string
    - name: timestamp
      type: string
    steps:
    - computeResources: {}
      env:
      - name: GOOS
        value: $(params.GOOS)
      - name: GOARCH
        value: $(params.GOARCH)
      - name: GO111MODULE
        value: $(params.GO111MODULE)
      - name: GOCACHE
        value: $(params.GOCACHE)
      - name: GOMODCACHE
        value: $(params.GOMODCACHE)
      - name: CGO_ENABLED
        value: $(params.CGO_ENABLED)
      - name: GOSUMDB
        value: $(params.GOSUMDB)
      - name: GOPROXY
        value: $(params.GOPROXY)
      image: golang:1.23.0
      name: build
      script: |
        {{ .BuildScript }}
      volumeMounts:
      - mountPath: /etc/localtime
        name: host-time
      - mountPath: /go
        name: dependence
      workingDir: $(workspaces.source.path)
    - computeResources: {}
      image: bash:5.1.4@sha256:b208215a4655538be652b2769d82e576bc4d0a2bb132144c060efc5be8c3f5d6
      name: get-version
      script: |
        #!/usr/bin/env bash
        set -e
        version=$({{ .VersionScript }})
        printf "%s" "${version}" > "$(results.version.path)"
      workingDir: $(workspaces.source.path)
    - computeResources: {}
      image: bash:5.1.4@sha256:b208215a4655538be652b2769d82e576bc4d0a2bb132144c060efc5be8c3f5d6
      name: get-timestamp
      script: |
        #!/usr/bin/env bash
        set -e
        timestamp=$(date +%Y%m%d%H%M%S)
        printf "%s" "${timestamp}" > "$(results.timestamp.path)"
      volumeMounts:
      - mountPath: /etc/localtime
        name: host-time
    volumes:
    - hostPath:
        path: /etc/localtime
      name: host-time
    - name: dependence
      persistentVolumeClaim:
        claimName: go-dependence
    workspaces:
    - name: source
variables: |
  [{"key":"Appname","value":""},{"key":"BuildScript","value":"go build"},{"key":"VersionScript","value":"echo 1.0"},{"key":"Username","value":""}]
type: tekton_task
---
name: tekton_template_task_node21_build
content: |
  apiVersion: tekton.dev/v1
  kind: Task
  metadata:
    annotations:
      author: {{ .Username }}
      tekton.dev/categories: Build Tools
      tekton.dev/displayName: npm build
      tekton.dev/pipelines.minVersion: 0.17.0
      tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le
      tekton.dev/tags: build-tool
    labels:
      app.kubernetes.io/version: "0.1"
    name: {{ .Appname }}-build-task
    namespace: default
  spec:
    description: |-
      This task can be used to run npm goals on a project.
      This task can be used to run npm goals on a project where package.json is present and has some pre-defined npm scripts.
    params:
    - default: .
      description: The path where package.json of the project is defined.
      name: PATH_CONTEXT
      type: string
    - default:
      - version
      description: The npm goals you want to run.
      name: ARGS
      type: array
    - default: node:21-alpine
      description: The node image you want to use.
      name: IMAGE
      type: string
    - default: https://registry.npmmirror.com
      description: The npm registry
      name: NPM_REGISTRY
      type: string
    results:
    - name: version
      type: string
    - name: timestamp
      type: string
    steps:
    - computeResources: {}
      env:
      - name: CI
        value: "true"
      image: $(params.IMAGE)
      name: npm-run
      script: |
        {{ .BuildScript }}
      workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
    - computeResources: {}
      image: bash:5.1.4@sha256:b208215a4655538be652b2769d82e576bc4d0a2bb132144c060efc5be8c3f5d6
      name: get-version
      script: |
        #!/usr/bin/env bash
        set -e
        version=$({{ .VersionScript }})
        printf "%s" "${version}" > "$(results.version.path)"
      workingDir: $(workspaces.source.path)
    - computeResources: {}
      image: bash:5.1.4@sha256:b208215a4655538be652b2769d82e576bc4d0a2bb132144c060efc5be8c3f5d6
      name: get-timestamp
      script: |
        #!/usr/bin/env bash
        set -e
        timestamp=$(date +%Y%m%d%H%M%S)
        printf "%s" "${timestamp}" > "$(results.timestamp.path)"
      volumeMounts:
      - mountPath: /etc/localtime
        name: host-time
    volumes:
    - hostPath:
        path: /etc/localtime
      name: host-time
    workspaces:
    - name: source
variables: |
  [{"key":"Appname","value":""},{"key":"BuildScript","value":"npm install && npm run build"},{"key":"VersionScript","value":"echo 1.0"},{"key":"Username","value":""}]
type: tekton_task
---
name: tekton_template_task_gitclone
content: |
  apiVersion: tekton.dev/v1
  kind: Task
  metadata:
    annotations:
      author: default
      tekton.dev/categories: Git
      tekton.dev/displayName: git clone
      tekton.dev/pipelines.minVersion: 0.38.0
      tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le,linux/arm64
      tekton.dev/tags: git
    creationTimestamp: "2024-02-19T10:02:21Z"
    labels:
      app.kubernetes.io/version: "0.9"
    name: default-git-clone-task
    namespace: default
  spec:
    description: These Tasks are Git tasks to work with repositories used by other tasks
      in your Pipeline. The git-clone Task will clone a repo from the provided url into
      the output Workspace. By default the repo will be cloned into the root of your
      Workspace. You can clone into a subdirectory by setting this Task's subdirectory
      param. This Task also supports sparse checkouts. To perform a sparse checkout,
      pass a list of comma separated directory patterns to this Task's sparseCheckoutDirectories
      param.
    params:
    - description: Repository URL to clone from.
      name: url
      type: string
    - default: ""
      description: Revision to checkout. (branch, tag, sha, ref, etc...)
      name: revision
      type: string
    - default: ""
      description: Refspec to fetch before checking out revision.
      name: refspec
      type: string
    - default: "true"
      description: Initialize and fetch git submodules.
      name: submodules
      type: string
    - default: "1"
      description: Perform a shallow clone, fetching only the most recent N commits.
      name: depth
      type: string
    - default: "true"
      description: Set the `http.sslVerify` global git config. Setting this to `false`
        is not advised unless you are sure that you trust your git remote.
      name: sslVerify
      type: string
    - default: ca-bundle.crt
      description: file name of mounted crt using ssl-ca-directory workspace. default
        value is ca-bundle.crt.
      name: crtFileName
      type: string
    - default: ""
      description: Subdirectory inside the `output` Workspace to clone the repo into.
      name: subdirectory
      type: string
    - default: ""
      description: Define the directory patterns to match or exclude when performing
        a sparse checkout.
      name: sparseCheckoutDirectories
      type: string
    - default: "true"
      description: Clean out the contents of the destination directory if it already
        exists before cloning.
      name: deleteExisting
      type: string
    - default: ""
      description: HTTP proxy server for non-SSL requests.
      name: httpProxy
      type: string
    - default: ""
      description: HTTPS proxy server for SSL requests.
      name: httpsProxy
      type: string
    - default: ""
      description: Opt out of proxying HTTP/HTTPS requests.
      name: noProxy
      type: string
    - default: "true"
      description: Log the commands that are executed during `git-clone`'s operation.
      name: verbose
      type: string
    - default: tekton-releases/github.com/tektoncd/pipeline/cmd/git-init:v0.40.2
      description: The image providing the git-init binary that this Task runs.
      name: gitInitImage
      type: string
    - default: /home/git
      description: |
        Absolute path to the user's home directory.
      name: userHome
      type: string
    results:
    - description: The precise commit SHA that was fetched by this Task.
      name: commit
      type: string
    - description: The precise URL that was fetched by this Task.
      name: url
      type: string
    - description: The epoch timestamp of the commit that was fetched by this Task.
      name: committer-date
      type: string
    steps:
    - computeResources: {}
      env:
      - name: HOME
        value: $(params.userHome)
      - name: PARAM_URL
        value: $(params.url)
      - name: PARAM_REVISION
        value: $(params.revision)
      - name: PARAM_REFSPEC
        value: $(params.refspec)
      - name: PARAM_SUBMODULES
        value: $(params.submodules)
      - name: PARAM_DEPTH
        value: $(params.depth)
      - name: PARAM_SSL_VERIFY
        value: $(params.sslVerify)
      - name: PARAM_CRT_FILENAME
        value: $(params.crtFileName)
      - name: PARAM_SUBDIRECTORY
        value: $(params.subdirectory)
      - name: PARAM_DELETE_EXISTING
        value: $(params.deleteExisting)
      - name: PARAM_HTTP_PROXY
        value: $(params.httpProxy)
      - name: PARAM_HTTPS_PROXY
        value: $(params.httpsProxy)
      - name: PARAM_NO_PROXY
        value: $(params.noProxy)
      - name: PARAM_VERBOSE
        value: $(params.verbose)
      - name: PARAM_SPARSE_CHECKOUT_DIRECTORIES
        value: $(params.sparseCheckoutDirectories)
      - name: PARAM_USER_HOME
        value: $(params.userHome)
      - name: WORKSPACE_OUTPUT_PATH
        value: $(workspaces.output.path)
      - name: WORKSPACE_SSH_DIRECTORY_BOUND
        value: $(workspaces.ssh-directory.bound)
      - name: WORKSPACE_SSH_DIRECTORY_PATH
        value: $(workspaces.ssh-directory.path)
      - name: WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND
        value: $(workspaces.basic-auth.bound)
      - name: WORKSPACE_BASIC_AUTH_DIRECTORY_PATH
        value: $(workspaces.basic-auth.path)
      - name: WORKSPACE_SSL_CA_DIRECTORY_BOUND
        value: $(workspaces.ssl-ca-directory.bound)
      - name: WORKSPACE_SSL_CA_DIRECTORY_PATH
        value: $(workspaces.ssl-ca-directory.path)
      image: $(params.gitInitImage)
      name: clone
      script: |
        #!/usr/bin/env sh
        set -eu
        if [ "${PARAM_VERBOSE}" = "true" ] ; then
          set -x
        fi
        if [ "${WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND}" = "true" ] ; then
          cp "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials" "${PARAM_USER_HOME}/.git-credentials"
          cp "${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig" "${PARAM_USER_HOME}/.gitconfig"
          chmod 400 "${PARAM_USER_HOME}/.git-credentials"
          chmod 400 "${PARAM_USER_HOME}/.gitconfig"
        fi
        if [ "${WORKSPACE_SSH_DIRECTORY_BOUND}" = "true" ] ; then
          cp -R "${WORKSPACE_SSH_DIRECTORY_PATH}" "${PARAM_USER_HOME}"/.ssh
          chmod 700 "${PARAM_USER_HOME}"/.ssh
          chmod -R 400 "${PARAM_USER_HOME}"/.ssh/*
        fi
        if [ "${WORKSPACE_SSL_CA_DIRECTORY_BOUND}" = "true" ] ; then
          export GIT_SSL_CAPATH="${WORKSPACE_SSL_CA_DIRECTORY_PATH}"
          if [ "${PARAM_CRT_FILENAME}" != "" ] ; then
              export GIT_SSL_CAINFO="${WORKSPACE_SSL_CA_DIRECTORY_PATH}/${PARAM_CRT_FILENAME}"
          fi
        fi
        CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"
        cleandir() {
          # Delete any existing contents of the repo directory if it exists.
          #
          # We don't just "rm -rf ${CHECKOUT_DIR}" because ${CHECKOUT_DIR} might be "/"
          # or the root of a mounted volume.
          if [ -d "${CHECKOUT_DIR}" ] ; then
            # Delete non-hidden files and directories
            rm -rf "${CHECKOUT_DIR:?}"/*
            # Delete files and directories starting with . but excluding ..
            rm -rf "${CHECKOUT_DIR}"/.[!.]*
            # Delete files and directories starting with .. plus any other character
            rm -rf "${CHECKOUT_DIR}"/..?*
          fi
        }
        if [ "${PARAM_DELETE_EXISTING}" = "true" ] ; then
          cleandir || true
        fi
        test -z "${PARAM_HTTP_PROXY}" || export HTTP_PROXY="${PARAM_HTTP_PROXY}"
        test -z "${PARAM_HTTPS_PROXY}" || export HTTPS_PROXY="${PARAM_HTTPS_PROXY}"
        test -z "${PARAM_NO_PROXY}" || export NO_PROXY="${PARAM_NO_PROXY}"
        git config --global --add safe.directory "${WORKSPACE_OUTPUT_PATH}"
        /ko-app/git-init \
          -url="${PARAM_URL}" \
          -revision="${PARAM_REVISION}" \
          -refspec="${PARAM_REFSPEC}" \
          -path="${CHECKOUT_DIR}" \
          -sslVerify="${PARAM_SSL_VERIFY}" \
          -submodules="${PARAM_SUBMODULES}" \
          -depth="${PARAM_DEPTH}" \
          -sparseCheckoutDirectories="${PARAM_SPARSE_CHECKOUT_DIRECTORIES}"
        cd "${CHECKOUT_DIR}"
        RESULT_SHA="$(git log -1 --abbrev=8 --pretty=format:%h)"
        EXIT_CODE="$?"
        if [ "${EXIT_CODE}" != 0 ] ; then
          exit "${EXIT_CODE}"
        fi
        RESULT_COMMITTER_DATE="$(date +%Y%m%d%H%M%S)"
        printf "%s" "${RESULT_COMMITTER_DATE}" > "$(results.committer-date.path)"
        printf "%s" "${RESULT_SHA}" > "$(results.commit.path)"
        printf "%s" "${PARAM_URL}" > "$(results.url.path)"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
    workspaces:
    - description: The git repo will be cloned onto the volume backing this Workspace.
      name: output
    - description: |
        A .ssh directory with private key, known_hosts, config, etc. Copied to
        the user's home before git commands are executed. Used to authenticate
        with the git remote when performing the clone. Binding a Secret to this
        Workspace is strongly recommended over other volume types.
      name: ssh-directory
      optional: true
    - description: |
        A Workspace containing a .gitconfig and .git-credentials file. These
        will be copied to the user's home before any git commands are run. Any
        other files in this Workspace are ignored. It is strongly recommended
        to use ssh-directory over basic-auth whenever possible and to bind a
        Secret to this Workspace over other volume types.
      name: basic-auth
      optional: true
    - description: |
        A workspace containing CA certificates, this will be used by Git to
        verify the peer with when fetching or pushing over HTTPS.
      name: ssl-ca-directory
      optional: true
variables: '[]'
type: tekton_task
---
name: tekton_template_task_kaniko
content: |
  apiVersion: tekton.dev/v1
  kind: Task
  metadata:
    annotations:
      author: default
      tekton.dev/categories: Image Build
      tekton.dev/displayName: Build and upload container image using Kaniko
      tekton.dev/pipelines.minVersion: 0.17.0
      tekton.dev/platforms: linux/amd64,linux/arm64,linux/ppc64le
      tekton.dev/tags: image-build
    labels:
      app.kubernetes.io/version: "0.6"
    name: default-kaniko-task
    namespace: default
  spec:
    description: This Task builds a simple Dockerfile with kaniko and pushes to a registry.
      This Task stores the image name and digest as results, allowing Tekton Chains
      to pick up that an image was built & sign it.
    params:
    - description: Name (reference) of the image to build.
      name: IMAGE
      type: string
    - default: ./Dockerfile
      description: Path to the Dockerfile to build.
      name: DOCKERFILE
      type: string
    - default: ./
      description: The build context used by Kaniko.
      name: CONTEXT
      type: string
    - default: []
      name: EXTRA_ARGS
      type: array
    - default: kaniko-project/executor:v1.5.1@sha256:c6166717f7fe0b7da44908c986137ecfeab21f31ec3992f6e128fff8a94be8a5
      description: The image on which builds will run (default is v1.5.1)
      name: BUILDER_IMAGE
      type: string
    results:
    - description: Digest of the image just built.
      name: IMAGE_DIGEST
      type: string
    - description: URL of the image just built.
      name: IMAGE_URL
      type: string
    steps:
    - args:
      - $(params.EXTRA_ARGS)
      - --dockerfile=$(params.DOCKERFILE)
      - --context=$(workspaces.source.path)/$(params.CONTEXT)
      - --destination=$(params.IMAGE)
      - --digest-file=$(results.IMAGE_DIGEST.path)
      computeResources: {}
      image: $(params.BUILDER_IMAGE)
      name: build-and-push
      securityContext:
        runAsUser: 0
      workingDir: $(workspaces.source.path)
    - computeResources: {}
      image: bash:5.1.4@sha256:c523c636b722339f41b6a431b44588ab2f762c5de5ec3bd7964420ff982fb1d9
      name: write-url
      script: |
        set -e
        image="$(params.IMAGE)"
        echo -n "${image}" | tee "$(results.IMAGE_URL.path)"
    workspaces:
    - description: Holds the context and Dockerfile
      name: source
    - description: Includes a docker `config.json`
      mountPath: /kaniko/.docker
      name: dockerconfig
      optional: true
variables: '[]'
type: tekton_task
---
name: tekton_template_task_deploy
content: |
  apiVersion: tekton.dev/v1
  kind: Task
  metadata:
    annotations:
      fiops/author: {{ .Username }}
      tekton.dev/categories: CLI
      tekton.dev/pipelines.minVersion: 0.12.1
      tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le,linux/arm64
      tekton.dev/tags: k8s-deploy
    labels:
      app.kubernetes.io/version: "0.1"
    name: default-deploy
    namespace: default
  spec:
    description: This task performs curl operation to transfer data from internet.
    params:
    - default: {{ .DeployAPI }}
      description: URL to curl'ed
      name: deploy-url
      type: string
    - name: artifact-url
      type: string
    - default: curl:7.80.0
      description: option of curl image
      name: curl-image
      type: string
    - description: application name
      name: app-name
      type: string
    steps:
    - computeResources: {}
      image: $(params.curl-image)
      name: curl
      script: |
        res=`curl -s -v -XPOST -H 'Content-Type: application/json' -H 'Authorization: {{ .BearerToken }}' -d '{ "app_name": "$(params.app-name)", "task_type": "deploy", "trigger_type": "tekton流水线", "waiting": false, "artifact_url": "$(params.artifact-url)" }' $(params.deploy-url)`
        echo $res
        echo $res | jq -r '.code' | grep 200 || { echo 'failed' ; exit 1; }
variables: |
  [{"key":"DeployAPI","value":""},{"key":"Username","value":""},{"key":"BearerToken","value":""}]
type: tekton_task
---
name: tekton_template_pipeline
content: |
  apiVersion: tekton.dev/v1
  kind: Pipeline
  metadata:
    annotations:
      author: {{ .Username }}
    name: {{ .Appname }}-pipeline
    namespace: default
  spec:
    params:
    - name: revision
      type: string
    - name: repo-url
      type: string
    tasks:
    - name: git-clone
      params:
      - name: url
        value: $(params.repo-url)
      - name: subdirectory
        value: ""
      - name: deleteExisting
        value: "true"
      - name: revision
        value: $(params.revision)
      taskRef:
        kind: Task
        name: default-git-clone-task
      workspaces:
      - name: output
        workspace: shared-workspace
      - name: ssh-directory
        workspace: git-credentials
    - name: build
      params:
      - name: appname
        value: {{ .Appname }}
      - name: flags
        value: -o
      runAfter:
      - git-clone
      taskRef:
        kind: Task
        name: {{ .Appname }}-build-task
      workspaces:
      - name: source
        workspace: shared-workspace
    - name: docker-build
      params:
      - name: IMAGE
        value: {{ .ImageUrl }}:$(tasks.build.results.version)
      - name: CONTEXT
        value: {{ .Context }}
      runAfter:
      - build
      taskRef:
        kind: Task
        name: default-kaniko-task
      workspaces:
      - name: source
        workspace: shared-workspace
      - name: dockerconfig
        workspace: dockerhub-auth
    - name: deploy
      params:
      - name: artifact-url
        value: $(tasks.docker-build.results.IMAGE_URL)
      - name: app-name
        value: {{ .Appname }}
      runAfter:
      - docker-build
      taskRef:
        kind: Task
        name: default-deploy
    workspaces:
    - name: shared-workspace
    - name: dockerhub-auth
    - name: git-credentials
variables: |
  [{"key":"Appname","value":""},{"key":"ImageUrl","value":""},{"key":"Context","value":""},{"key":"Username","value":""}]
type: tekton_pipeline
---
name: tekton_template_triggerbinding
content: |
  apiVersion: triggers.tekton.dev/v1beta1
  kind: TriggerBinding
  metadata:
    annotations:
      author: {{ .Username }}
    name: {{ .Appname }}-triggerbinding
    namespace: default
  spec:
    params:
    - name: gitrevision
      value: $(body.ref)
    - name: namespace
      value: default
    - name: gitrepositoryurl
      value: $(body.git_ssh_url)
    - name: application
      value: $(body.app_name)
variables: |
  [{"key":"Appname","value":""},{"key":"Username","value":""}]
type: tekton_triggerbinding
---
name: tekton_template_triggertemplate
content: |
  apiVersion: triggers.tekton.dev/v1beta1
  kind: TriggerTemplate
  metadata:
    annotations:
      author: {{ .Username }}
    name: {{ .Appname }}-triggertemplate
    namespace: default
  spec:
    params:
    - default: master
      description: The git revision
      name: gitrevision
    - description: The git repository url
      name: gitrepositoryurl
    - default: tekton-pipeline
      description: The namespace to create the resources
      name: namespace
    - description: The application needs to be triggered
      name: application
    resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        annotations:
          author: {{ .Username }}
        generateName: $(tt.params.application)-pipeline-run-
        namespace: $(tt.params.namespace)
      spec:
        params:
        - name: revision
          value: $(tt.params.gitrevision)
        - name: repo-url
          value: $(tt.params.gitrepositoryurl)
        pipelineRef:
          name: $(tt.params.application)-pipeline
        serviceAccountName: default
        workspaces:
        - name: shared-workspace
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
              storageClassName: nfs-client
        - name: dockerhub-auth
          secret:
            secretName: docker-credential
        - name: git-credentials
          secret:
            secretName: git-credentials
variables: |
  [{"key":"Appname","value":""},{"key":"Username","value":""}]
type: tekton_triggertemplate
---
name: tekton_template_eventlistener
content: |
  apiVersion: triggers.tekton.dev/v1beta1
  kind: EventListener
  metadata:
    annotations:
      endpoint: {{ .Endpoint }}
      author: {{ .Username }}
    name: {{ .Appname }}-eventlistener
    namespace: default
  spec:
    namespaceSelector: {}
    resources: {}
    serviceAccountName: tekton-triggers-gitlab-sa
    triggers:
    - bindings:
      - kind: TriggerBinding
        ref: {{ .Appname }}-triggerbinding
      name: trigger-match
      template:
        ref: {{ .Appname }}-triggertemplate
variables: |
  [{"key":"Appname","value":""},{"key":"Username","value":""},{"key":"Endpoint","value":""}]
type: tekton_eventlistener